<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture viewer | Modern C++ Course</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="viewer-page">
    <header class="site-header viewer-header">
        <div class="viewer-heading">
            <a class="site-brand" href="index.html">Modern C++ Course</a>
            <h1>Lecture viewer</h1>
        </div>
        <a class="back-link" href="index.html">Course home</a>
    </header>

    <main class="viewer-main">
        <nav class="lecture-sidebar" aria-label="Lecture list">
            <h2>Lectures</h2>
            <ul class="lecture-list">
                <li>
                    <a class="lecture-link" href="#lec-01-08" data-src="lecs/lec-01-08.html" data-title="Templates">
                        <span class="lecture-label">Lecture 01&ndash;08</span>
                        <span class="lecture-title">Templates</span>
                    </a>
                </li>
            </ul>
        </nav>

        <section class="deck-pane" aria-labelledby="deck-title">
            <div class="deck-toolbar">
                <p id="deck-title" aria-live="polite">Templates</p>
                <a class="deck-open" id="deck-open" href="lecs/lec-01-08.html" target="_blank" rel="noopener">Open deck in new tab</a>
            </div>
            <iframe class="deck-frame" id="deck-frame" src="lecs/lec-01-08.html" title="Templates lecture deck"></iframe>
        </section>
    </main>

    <script>
        (function () {
            "use strict";

            var links = Array.prototype.slice.call(document.querySelectorAll(".lecture-link"));
            var frame = document.getElementById("deck-frame");
            var openLink = document.getElementById("deck-open");
            var deckTitle = document.getElementById("deck-title");

            if (!links.length || !frame || !openLink || !deckTitle) {
                return;
            }

            function keyFor(link) {
                return link.getAttribute("href").slice(1);
            }

            function findLecture(key) {
                for (var i = 0; i < links.length; i += 1) {
                    if (keyFor(links[i]) === key) {
                        return links[i];
                    }
                }
                return null;
            }

            function select(link) {
                var src = link.getAttribute("data-src");
                var title = link.getAttribute("data-title") || keyFor(link);

                links.forEach(function (item) {
                    if (item === link) {
                        item.setAttribute("aria-current", "page");
                    } else {
                        item.removeAttribute("aria-current");
                    }
                });

                if (frame.getAttribute("src") !== src) {
                    frame.setAttribute("src", src);
                }
                frame.setAttribute("title", title + " lecture deck");
                openLink.setAttribute("href", src);
                deckTitle.textContent = title;
            }

            function applyHash() {
                var raw = window.location.hash.replace(/^#/, "");
                var key = raw;

                try {
                    key = decodeURIComponent(raw);
                } catch (error) {
                    key = "";
                }

                var link = findLecture(key);

                if (!link) {
                    link = links[0];
                    var fallback = keyFor(link);
                    if (window.location.hash !== "#" + fallback) {
                        window.history.replaceState(null, "", "#" + fallback);
                    }
                }

                select(link);
            }

            links.forEach(function (link) {
                link.addEventListener("click", function (event) {
                    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
                        return;
                    }

                    event.preventDefault();
                    var key = keyFor(link);

                    if (window.location.hash === "#" + key) {
                        select(link);
                    } else {
                        window.location.hash = key;
                    }
                });
            });

            window.addEventListener("hashchange", applyHash);
            window.addEventListener("popstate", applyHash);
            applyHash();
        }());
    </script>
</body>
</html>
